<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Colophon Desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <h1>Colophon Desk</h1>
    <main class="showroom" aria-busy="true">
      <section class="line-up" aria-labelledby="line-up-title" hidden>
        <h2 id="line-up-title">Choose a computer</h2>
        <ol aria-label="Computers, in the order they came out"></ol>
      </section>
      <section class="set-up" aria-labelledby="set-up-title" hidden>
        <div class="stage"></div>
        <div class="panel">
          <a href="./"><span aria-hidden="true">‹</span> All computers</a>
          <h2 id="set-up-title" tabindex="-1"></h2>
          <p></p>
          <form action="desk.html"></form>
        </div>
      </section>
    </main>

    <script src="./js/showroom.js" type="module"></script>
  </body>
</html>
